<!-- Backdrop para mobile -->
<!-- Fica visível em dispositivos móveis para escurecer o conteúdo principal quando o sidebar está aberto. -->
<!-- A opacidade e a interação são controladas pelo estado 'isOpen()'. -->
<!-- O clique no backdrop fecha o sidebar. -->
<div 
  class="fixed inset-0 bg-black/30 z-30 transition-opacity md:hidden"
  [class.opacity-100]="isOpen()"
  [class.opacity-0]="!isOpen()"
  [class.pointer-events-auto]="isOpen()"
  [class.pointer-events-none]="!isOpen()"
  (click)="closeSidebar()">
</div>

<!-- Sidebar -->
<!-- A classe 'translate-x-0' (visível) ou '-translate-x-full' (oculto) é aplicada com base no estado 'isOpen()'. -->
<aside 
  class="fixed top-0 left-0 w-64 h-full bg-gradient-to-b from-emerald-800 via-green-800 to-emerald-900 flex flex-col z-40
         transition-transform duration-300 ease-in-out
         md:relative md:translate-x-0"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()">

  <!-- Logo e Botão de Fechar para Mobile -->
  <!-- Contém o logo da aplicação e o botão para fechar o sidebar em dispositivos móveis. -->
  <div class="h-20 flex items-center justify-between px-6 border-b border-white/10">
    <div class="flex items-center space-x-3">
      <div class="p-2 bg-green-500/20 rounded-lg">
        <lucide-icon [img]="icons.gem" [size]="24" class="text-green-400"></lucide-icon>
      </div>
      <div>
        <h1 class="text-xl font-bold text-white tracking-tight">Sobrai</h1>
        <p class="text-xs text-green-400 font-semibold">Fiscal e Financeiro</p>
      </div>
    </div>
    <!-- Botão de fechar, visível apenas em telas menores que 'md'. -->
    <button (click)="closeSidebar()" class="md:hidden p-2 rounded-md text-emerald-100 hover:bg-emerald-700/60">
      <lucide-icon [img]="icons.x" [size]="24"></lucide-icon>
    </button>
  </div>

  <!-- Navegação Principal -->
  <!-- Itera sobre os itens de navegação (navItems) para construir o menu. -->
  <nav class="flex-1 p-4 space-y-1">
    <p class="px-4 pt-2 pb-2 text-xs font-semibold text-emerald-200 uppercase">Menu</p>
    @for (item of navItems; track item.path) {
      <!-- Cada item é um link de roteamento. -->
      <!-- 'routerLinkActive' aplica classes CSS quando a rota está ativa. -->
      <!-- 'routerLinkActiveOptions' com 'exact: true' garante que a classe ativa seja aplicada apenas para correspondências exatas de rota. -->
      <!-- 'closeSidebar()' é chamado ao clicar em um item para fechar o menu em dispositivos móveis. -->
      <a
        [routerLink]="['/', item.path]"
        routerLinkActive="bg-emerald-600 text-white"
        [routerLinkActiveOptions]="{ exact: item.path === 'painel-principal' }"
        (click)="closeSidebar()"
        class="flex items-center px-4 py-2.5 text-emerald-100 rounded-lg hover:bg-emerald-700/40 hover:text-white transition-colors duration-200 font-medium"
      >
        <lucide-icon [img]="item.icon" [size]="20"></lucide-icon>
        <span class="ml-3">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Card de IA Ativa -->
  <!-- Um card informativo que indica que a funcionalidade de IA está ativa. -->
  <div class="p-4 mt-auto">
    <div class="p-4 bg-green-500/20 rounded-lg text-center">
      <div class="flex items-center justify-center space-x-2">
        <lucide-icon [img]="icons.sparkles" [size]="20" class="text-green-300"></lucide-icon>
        <h4 class="font-bold text-white">IA Ativa</h4>
      </div>
      <p class="text-xs text-emerald-100 mt-1">Monitorando finanças e impostos.</p>
    </div>
  </div>

  <!-- Perfil do Usuário -->
  <!-- Exibe o nome do usuário e um botão de logout. -->
  <div class="p-4 border-t border-white/10">
    <div class="flex items-center">
      <div class="flex-1">
        <!-- O nome do usuário é exibido e truncado se for muito longo. -->
        <p class="text-sm font-semibold text-white truncate" [title]="userName()">{{ userName() }}</p>
      </div>
      <!-- Botão para chamar a função de logout. -->
      <button type="button" (click)="logout()" class="p-2 rounded-md text-emerald-100 hover:bg-emerald-700/60">
        <lucide-icon [img]="icons.logOut" [size]="20"></lucide-icon>
      </button>
    </div>
  </div>
</aside>
