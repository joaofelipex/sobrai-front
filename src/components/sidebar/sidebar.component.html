<!-- Fundo escurecido no mobile quando o menu está aberto; clicar fecha. -->
<div
  class="fixed inset-0 bg-slate-900/40 z-30 transition-opacity md:hidden"
  [class.opacity-100]="isOpen()"
  [class.opacity-0]="!isOpen()"
  [class.pointer-events-auto]="isOpen()"
  [class.pointer-events-none]="!isOpen()"
  (click)="closeSidebar()">
</div>

<aside
  class="fixed top-0 left-0 w-60 h-full bg-slate-900 flex flex-col z-40 transition-transform duration-200 md:sticky md:top-0 md:h-screen md:translate-x-0 md:flex-shrink-0"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()">

  <!-- Marca -->
  <div class="h-16 flex items-center justify-between px-5 border-b border-white/10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded bg-emerald-600 text-white flex items-center justify-center text-sm font-bold">S</div>
      <div class="leading-tight">
        <p class="text-[15px] font-semibold text-white">Sobrai</p>
        <p class="text-[11px] text-slate-400">Gestão fiscal e financeira</p>
      </div>
    </div>
    <button (click)="closeSidebar()" class="md:hidden p-1.5 rounded text-slate-400 hover:text-white hover:bg-white/10" aria-label="Fechar menu">
      <lucide-icon [img]="icons.x" [size]="20"></lucide-icon>
    </button>
  </div>

  <!-- Navegação agrupada -->
  <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-5">
    @for (group of navGroups; track group.label) {
      <div>
        <p class="px-3 mb-1 text-[11px] font-medium uppercase tracking-wider text-slate-500">{{ group.label }}</p>
        <div class="space-y-0.5">
          @for (item of group.items; track item.path) {
            <a
              [routerLink]="['/', item.path]"
              routerLinkActive="bg-white/10 text-white"
              [routerLinkActiveOptions]="{ exact: item.path === 'painel-principal' }"
              (click)="closeSidebar()"
              class="flex items-center gap-3 px-3 py-2 rounded text-[13.5px] text-slate-300 hover:bg-white/5 hover:text-white transition-colors"
            >
              <lucide-icon [img]="item.icon" [size]="17" [strokeWidth]="1.75"></lucide-icon>
              <span>{{ item.label }}</span>
            </a>
          }
        </div>
      </div>
    }
  </nav>

  <!-- Usuário -->
  <div class="px-4 py-3 border-t border-white/10 flex items-center gap-3">
    <div class="w-8 h-8 rounded-full bg-slate-700 text-slate-200 flex items-center justify-center text-xs font-semibold flex-shrink-0">
      {{ userName().charAt(0).toUpperCase() }}
    </div>
    <p class="flex-1 min-w-0 text-[13px] font-medium text-slate-200 truncate" [title]="userName()">{{ userName() }}</p>
    <button type="button" (click)="logout()" class="p-1.5 rounded text-slate-400 hover:text-white hover:bg-white/10" title="Sair" aria-label="Sair">
      <lucide-icon [img]="icons.logOut" [size]="17"></lucide-icon>
    </button>
  </div>
</aside>
