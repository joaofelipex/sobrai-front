<nav class="md:hidden fixed bottom-0 inset-x-0 z-20 bg-white/95 backdrop-blur-xl border-t border-slate-200/70 pb-[env(safe-area-inset-bottom)]" aria-label="Navegação principal">
  <ul class="grid grid-cols-5 px-1">
    @for (tab of tabs; track tab.path) {
      <li>
        <a [routerLink]="['/', tab.path]"
           routerLinkActive="text-emerald-700 [&_.pill]:bg-emerald-100"
           [routerLinkActiveOptions]="{ exact: tab.path === 'mixco' }"
           class="flex flex-col items-center justify-center gap-0.5 h-16 text-slate-500 active:scale-95 transition">
          <span class="pill flex items-center justify-center w-12 h-7 rounded-full transition-colors">
            <lucide-icon [img]="tab.icon" [size]="20" [strokeWidth]="1.9"></lucide-icon>
          </span>
          <span class="text-[10.5px] font-semibold leading-none">{{ tab.label }}</span>
        </a>
      </li>
    }
    <li>
      <button type="button" (click)="sidebar.toggle()"
              class="w-full flex flex-col items-center justify-center gap-0.5 h-16 text-slate-500 active:scale-95 transition">
        <span class="flex items-center justify-center w-12 h-7"><lucide-icon [img]="menuIcon" [size]="20" [strokeWidth]="1.9"></lucide-icon></span>
        <span class="text-[10.5px] font-semibold leading-none">Menu</span>
      </button>
    </li>
  </ul>
</nav>
