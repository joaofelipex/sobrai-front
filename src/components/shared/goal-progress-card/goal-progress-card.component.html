@if (goal(); as g) {
<div class="bg-white/90 dark:bg-slate-800/50 backdrop-blur-sm border border-slate-200/60 dark:border-slate-700 rounded-xl shadow-sm p-6 transition-all duration-300 ease-out hover:shadow-lg dark:hover:shadow-primary-900/30 hover:-translate-y-1">
  <div class="flex flex-col sm:flex-row sm:items-center sm:space-x-6">
    <!-- Icon -->
    <div class="flex-shrink-0 w-16 h-16 bg-gradient-to-br from-primary-400 to-primary-600 text-white shadow-md shadow-primary-500/20 rounded-full flex items-center justify-center mx-auto sm:mx-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
    </div>

    <!-- Progress Info -->
    <div class="flex-1 mt-4 sm:mt-0 text-center sm:text-left">
      <div class="flex flex-col sm:flex-row sm:items-baseline sm:justify-between">
        <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-200">{{ g.name }}</h3>
        <span class="text-sm font-semibold text-primary-600 dark:text-primary-400 mt-1 sm:mt-0">{{ progress().toFixed(0) }}% Concluído</span>
      </div>
      <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2.5 my-2">
        <div class="bg-primary-500 h-2.5 rounded-full" [style.width.%]="progress()"></div>
      </div>
      <div class="text-sm text-slate-500 dark:text-slate-400">
        <span>{{ currentAmount().toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) }}</span>
        <span class="px-2">de</span>
        <span class="font-medium text-slate-700 dark:text-slate-300">{{ g.targetAmount.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) }}</span>
      </div>
    </div>
    
    <!-- Action Button -->
    <div class="mt-4 sm:mt-0 sm:ml-6 text-center">
      <a routerLink="/metas" class="px-4 py-2 text-sm font-semibold bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
        Ver todas as metas
      </a>
    </div>
  </div>
</div>
}
