
@if (goal(); as g) {
<div class="bg-white rounded-xl shadow-md p-6 transition-all duration-300 ease-out hover:shadow-lg hover:-translate-y-1">
  <div class="flex flex-col sm:flex-row sm:items-center sm:space-x-6">
    <!-- Icon -->
    <div class="flex-shrink-0 w-16 h-16 bg-primary-100 rounded-full flex items-center justify-center mx-auto sm:mx-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary-600"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
    </div>

    <!-- Progress Info -->
    <div class="flex-1 mt-4 sm:mt-0 text-center sm:text-left">
      <div class="flex flex-col sm:flex-row sm:items-baseline sm:justify-between">
        <h3 class="text-lg font-semibold text-gray-800">{{ g.name }}</h3>
        <span class="text-sm font-semibold text-primary-600 mt-1 sm:mt-0">{{ progress().toFixed(0) }}% Concluído</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2.5 my-2">
        <div class="bg-primary-500 h-2.5 rounded-full" [style.width.%]="progress()"></div>
      </div>
      <div class="text-sm text-gray-500">
        <span>{{ currentAmount().toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) }}</span>
        <span class="px-2">de</span>
        <span class="font-medium text-gray-700">{{ g.targetAmount.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) }}</span>
      </div>
    </div>
    
    <!-- Action Button -->
    <div class="mt-4 sm:mt-0 sm:ml-6 text-center">
      <a routerLink="/metas" class="px-4 py-2 text-sm font-semibold bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
        Ver todas as metas
      </a>
    </div>
  </div>
</div>
}
