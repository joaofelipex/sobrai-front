@if (metric(); as m) {
  <a [routerLink]="link()" 
     class="block bg-white border border-slate-200/80 rounded-xl shadow-sm p-5 transition-all duration-300 ease-out hover:shadow-md hover:-translate-y-1">
    <div class="flex flex-col justify-between h-full">
      <div class="flex items-start justify-between">
        <p class="text-sm font-semibold text-slate-500">{{ m.title }}</p>
        <div class="w-10 h-10 flex items-center justify-center rounded-full" [ngClass]="m.bgColor">
          @if (m.icon === 'dollar-sign') {
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [ngClass]="m.iconColor"><line x1="12" x2="12" y1="2" y2="22"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          } @else if (m.icon === 'receipt') {
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [ngClass]="m.iconColor"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><path d="M12 17V7"></path></svg>
          } @else if (m.icon === 'file-text') {
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [ngClass]="m.iconColor"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" x2="8" y1="13" y2="13"></line><line x1="16" x2="8" y1="17" y2="17"></line><line x1="10" x2="8" y1="9" y2="9"></line></svg>
          } @else if (m.icon === 'trending-up') {
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [ngClass]="m.iconColor"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
          }
        </div>
      </div>
      <div class="mt-2">
        <p class="text-3xl font-bold text-slate-800">{{ m.value }}</p>
        @if(m.change) {
          <div class="mt-1 flex items-center text-sm space-x-1">
            <span class="font-semibold" [class.text-green-600]="m.changeType === 'positive'" [class.text-red-600]="m.changeType === 'negative'">
              {{ m.change }}
            </span>
            <span class="text-slate-500">{{ m.description }}</span>
          </div>
        }
      </div>
    </div>
  </a>
}
