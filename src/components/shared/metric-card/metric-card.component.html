@if (metric(); as m) {
  <a [routerLink]="link()"
     class="block bg-white border border-slate-200 rounded-lg px-5 py-4 transition-colors hover:border-slate-300 hover:bg-slate-50/60">
    <p class="text-xs font-medium text-slate-500">{{ m.title }}</p>
    <p class="mt-1.5 text-2xl font-semibold text-slate-900 tabular">{{ m.value }}</p>
    <p class="mt-1 text-xs text-slate-500">
      @if (m.change) {
        <span class="font-semibold"
              [class.text-success-700]="m.changeType === 'positive'"
              [class.text-red-700]="m.changeType === 'negative'">{{ m.change }}</span>
      }
      {{ m.description }}
    </p>
  </a>
}
