
@if (metric(); as m) {
  @if (link(); as l) {
    <a [routerLink]="l" class="block bg-white rounded-xl shadow-md p-6 transition-all duration-300 ease-out hover:shadow-xl hover:-translate-y-1 hover:ring-2 hover:ring-primary-400/50">
      <div class="flex flex-col justify-between h-full">
        <div class="flex items-start justify-between">
          <p class="text-base font-semibold text-gray-600">{{ m.title }}</p>
          <div class="w-10 h-10 flex items-center justify-center rounded-lg bg-primary-100 text-primary-600">
            @if (m.icon === 'trending-up') {
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
            } @else if (m.icon === 'receipt') {
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" x2="8" y1="13" y2="13"></line><line x1="16" x2="8" y1="17" y2="17"></line><line x1="10" x2="8" y1="9" y2="9"></line></svg>
            } @else if (m.icon === 'bar-chart') {
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="20" y2="10"></line><line x1="18" x2="18" y1="20" y2="4"></line><line x1="6" x2="6" y1="20" y2="16"></line></svg>
            } @else if (m.icon === 'clock') {
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            }
          </div>
        </div>
        <div class="mt-4">
          <p class="text-3xl font-bold text-gray-900">{{ m.value }}</p>
          <div class="mt-2 flex items-center text-sm">
            <span class="text-gray-500">{{ m.description }}</span>
          </div>
        </div>
      </div>
    </a>
  } @else {
    <div class="relative bg-white rounded-xl shadow-md p-6 flex flex-col justify-between">
       <!-- ... Conteúdo original para cards não-clicáveis ... -->
    </div>
  }
}
