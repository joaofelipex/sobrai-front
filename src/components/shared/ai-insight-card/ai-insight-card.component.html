@if (insight(); as i) {
<div class="bg-white border-l-4 rounded-xl shadow-sm p-5 flex flex-col justify-between h-full"
     [ngClass]="{
       'border-green-400': i.type === 'economy',
       'bg-green-50/70': i.type === 'economy',
       'border-blue-400': i.type === 'cashflow',
       'bg-blue-50/70': i.type === 'cashflow',
       'border-orange-400': i.type === 'reminder',
       'bg-orange-50/70': i.type === 'reminder'
     }">
  <div>
    <div class="flex items-start space-x-3">
      <div class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full"
           [ngClass]="{
             'bg-green-100 text-green-600': i.type === 'economy',
             'bg-blue-100 text-blue-600': i.type === 'cashflow',
             'bg-orange-100 text-orange-600': i.type === 'reminder'
           }">
         @if (i.icon === 'dollar-sign') {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="2" y2="22"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
         } @else if (i.icon === 'trending-up') {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
         } @else if (i.icon === 'alert-triangle') {
           <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
         }
      </div>
      <div class="flex-1">
        <div class="flex items-center space-x-2">
            <h3 class="text-base font-bold text-slate-800">{{ i.title }}</h3>
        </div>
         <span class="text-xs font-bold px-2 py-0.5 rounded-full"
               [ngClass]="{
                 'bg-red-100 text-red-700': i.priority === 'Alta prioridade',
                 'bg-yellow-100 text-yellow-700': i.priority === 'Média prioridade',
                 'bg-blue-100 text-blue-700': i.priority === 'Baixa prioridade'
               }">{{ i.priority }}</span>
      </div>
    </div>
    
    <p class="text-slate-600 text-sm mt-3">{{ i.description }}</p>

    <div class="mt-4 p-3 rounded-lg"
         [ngClass]="{
           'bg-green-100': i.type === 'economy',
           'bg-blue-100': i.type === 'cashflow',
           'bg-orange-100': i.type === 'reminder'
         }">
      <p class="text-xs font-semibold text-slate-500">Impacto estimado:</p>
      <p class="font-bold text-slate-800">{{ i.estimatedImpact }}</p>
    </div>
  </div>

  <a href="#" class="mt-4 flex items-center justify-end text-sm font-bold text-indigo-600 hover:text-indigo-800 group">
    <span>Ver detalhes</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="ml-1 transition-transform group-hover:translate-x-1"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
  </a>
</div>
}
