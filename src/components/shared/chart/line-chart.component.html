@if (chart(); as c) {
  <div class="w-full">
    <svg [attr.viewBox]="'0 0 ' + width() + ' ' + height()" [attr.height]="height()" class="w-full block" role="img" aria-label="Gráfico de linhas">
      @for (g of c.grid; track g.y) {
        <line [attr.x1]="c.left" [attr.x2]="c.right" [attr.y1]="g.y" [attr.y2]="g.y"
              [attr.stroke]="g.zero ? '#94a3b8' : '#e2e8f0'" stroke-width="1" />
        <text [attr.x]="c.left - 8" [attr.y]="g.y + 3.5" font-size="10.5" text-anchor="end" fill="#64748b">{{ g.label }}</text>
      }
      @for (s of c.series; track s.key) {
        <path [attr.d]="s.d" [attr.stroke]="s.color" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
        <circle [attr.cx]="s.last.x" [attr.cy]="s.last.y" r="3.5" [attr.fill]="s.color" />
      }
      @for (l of c.labels; track l.x) {
        <text [attr.x]="l.x" [attr.y]="l.y" font-size="10.5" text-anchor="middle" fill="#64748b">{{ l.name }}</text>
      }
    </svg>
    @if (keys().length > 1) {
      <div class="flex items-center justify-center gap-5 mt-3 text-xs text-slate-600">
        @for (key of keys(); track key) {
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-sm" [style.background-color]="colorOf(key)"></span>
            <span>{{ key }}</span>
          </div>
        }
      </div>
    }
  </div>
} @else {
  <div class="w-full h-48 flex items-center justify-center text-sm text-slate-400">
    Dados insuficientes para exibir o gráfico.
  </div>
}
